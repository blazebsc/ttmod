name: CI

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        # lua5.1 + lua5.2 are REQUIRED, not optional: the Lua proofs run on
        # both, because the game behaves as 5.1 (no setmetatable, nil _G) while
        # stock 5.2 would hide both bugs. They also need a writable shared tmp
        # dir for the menu-literal round trip between test_modconfig and
        # test_menumods_ui.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3 lua5.1 lua5.2
      - name: Show resolved Lua versions
        run: |
          lua5.1 -v
          lua5.2 -v
      - name: Build and test
        run: cmake --preset linux-debug && cmake --build --preset linux-debug && ctest --preset linux-debug

  cross-win32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Cross-build win32 runtime
        run: cmake --preset win32-mingw && cmake --build --preset win32-mingw
      - name: Verify win32 artifacts
        run: sh tools/verify_win32.sh build-win32

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3 lua5.1 lua5.2
      - name: ASan build and test
        run: cmake --preset linux-asan && cmake --build --preset linux-asan && ctest --preset linux-asan
      - name: UBSan build and test
        run: cmake --preset linux-ubsan && cmake --build --preset linux-ubsan && ctest --preset linux-ubsan

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_format.py diffs changed lines vs base
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Changed lines match .clang-format
        # Grandfathered tree: only lines changed in this push/PR are checked
        # (see tools/check_format.py). Base = PR base, or previous push.
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            python3 tools/check_format.py "origin/${{ github.base_ref }}"
          else
            python3 tools/check_format.py "${{ github.event.before }}"
          fi
